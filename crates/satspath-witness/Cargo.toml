[package]
name = "satspath-witness"
version = "0.1.0"
edition = "2021"
description = "SatsPath Server-to-Server checkpoint witness and split-view detector"

[dependencies]
satspath-core = { path = "../satspath-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
hex = "0.4"
sha2 = { workspace = true }
async-trait = "0.1.77"

[dev-dependencies]
tempfile = "3"
