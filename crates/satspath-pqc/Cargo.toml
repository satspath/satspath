[package]
name = "satspath-pqc"
version = "0.1.0"
edition = "2021"
description = "Post-quantum and hybrid cryptographic primitives for SatsPath"
publish = false

[dependencies]
# ML-KEM (Kyber) — NIST FIPS 203 standardized KEM
ml-kem = { version = "0.2", features = ["deterministic", "zeroize"] }

# ML-DSA (Dilithium) — NIST FIPS 204 standardized digital signatures
ml-dsa = "0.1"

# Classical crypto for hybrid constructions
x25519-dalek = { version = "2", features = ["static_secrets"] }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
chacha20poly1305 = "0.10"

[dev-dependencies]
criterion = "0.8.2"
rand = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[[bench]]
name = "crypto_benches"
harness = false
